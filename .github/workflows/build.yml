name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          # ⚠️ 必须配置 SIGNING_KEY（正式 keystore 的 base64）！
          # 未配置时禁止随机生成——v1.8.x 曾因随机生成导致每版签名不同，
          # 用户无法覆盖安装（签名冲突）。未配置直接构建失败，提醒配置。
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret 未配置！请在仓库 Settings → Secrets 配置正式 keystore 的 base64（Mac 上 ~/reminder-release.keystore 经 base64 编码），否则构建失败。"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > release.keystore

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests (lunar calendar regression)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'reminder' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        # 依赖下载偶发网络抖动（502/超时）会直接判死，重试两次再放弃
        run: |
          for attempt in 1 2 3; do
            echo "::group::Gradle build attempt $attempt"
            if ./gradlew assembleRelease --no-daemon; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "构建失败（第 $attempt 次），10 秒后重试..."
            sleep 10
          done
          echo "三次尝试均失败"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Prepare versioned release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/app-release-${VERSION}.apk"

      - name: Upload to Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
